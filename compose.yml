services:
  edge:
    image: ${NGINX_IMAGE:-nginx:1.30.6}
    ports:
      - "${BLASTER_BIND_ADDRESS:-127.0.0.1}:${BLASTER_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${BLASTER_TLS_DIR:?Set BLASTER_TLS_DIR to an external operator-managed TLS directory}
        target: /run/blaster-tls
        read_only: true
        bind:
          create_host_path: false
    depends_on: [apisix]
    security_opt: [no-new-privileges:true]
    networks: [backplane]
    restart: unless-stopped
  apisix:
    image: ${APISIX_IMAGE:-apache/apisix:3.19.0-debian}
    user: "0:0"
    environment:
      APISIX_STAND_ALONE: "true"
    # No published data-plane or admin ports.
    volumes:
      - ./gateway/apisix.yml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/start-apisix.sh:/usr/local/bin/blaster-start:ro
      - type: bind
        source: ./runtime/apisix
        target: /usr/local/apisix/conf/rendered
        read_only: true
        bind:
          create_host_path: false
    # Keep vendor defaults; link only the standalone runtime file into its standard location.
    entrypoint: [/bin/sh, /usr/local/bin/blaster-start]
    extra_hosts: [host.docker.internal:host-gateway]
    security_opt: [no-new-privileges:true]
    networks: [backplane]
    restart: unless-stopped
  vault:
    profiles: [administration]
    image: ${VAULT_IMAGE:-hashicorp/vault:2.0.3}
    command: [server, -config=/vault/config/server.hcl]
    ports: ["127.0.0.1:${VAULT_LOCAL_PORT:-18200}:8200"]
    volumes:
      - ./vault:/vault/config:ro
      - vault-data:/vault/data
    security_opt: [no-new-privileges:true]
    networks: [vault-admin]
    restart: unless-stopped
networks:
  backplane: {}
  vault-admin:
    internal: true
volumes:
  vault-data: {}
