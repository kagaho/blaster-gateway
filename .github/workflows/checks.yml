name: Blaster checks
on:
  push:
    branches: [main, 'release/**', 'review/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_docs.py
      - run: python tools/security_scan.py
      - run: git show --format= --check HEAD
      - name: Validate Compose without private mounts or credentials
        env:
          BLASTER_TLS_DIR: /tmp/operator-managed-tls
        run: docker compose --profile administration config --quiet
