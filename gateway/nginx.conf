events {}
http {
    server_tokens off;
    # No query strings, authorization headers, or request bodies in access logs.
    log_format blaster '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout blaster;
    error_log /dev/stderr warn;
    upstream policy_gateway { server apisix:9080; }
    server {
        listen 8443 ssl;
        server_name 192.168.15.10;
        ssl_certificate /run/blaster-tls/tls.crt;
        ssl_certificate_key /run/blaster-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; return 200 'ok\n'; }
        # No direct backend locations: aliases also traverse APISIX authentication.
        location / {
            proxy_pass http://policy_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
